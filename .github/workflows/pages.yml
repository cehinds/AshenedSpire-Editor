name: Versioned Pages

on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build consolidated HTML
    if: contains(fromJSON('["dev","test","main"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKBENCH_BASE_PATH: /${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.run_number }}-${{ github.run_attempt }}/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run review:quick
      - run: npm run build:pages
      - run: npm run check:pages-html
      - run: npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/pages/index.html
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Preserve history and deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: editor-pages-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: editor-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/pages/
      - name: Add immutable build to shared gh-pages history
        env:
          PAGES_BUILD_DIRECTORY: dist/pages
        run: node scripts/publish-pages-history.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .pages-site/
      - name: Deploy full site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report exact preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## Published AshenedSpire Editor' >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${PAGE_URL}${GITHUB_REF_NAME}/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest: ${PAGE_URL}${GITHUB_REF_NAME}/latest/" >> "$GITHUB_STEP_SUMMARY"
