<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AshenedSpire responsive editor preview</title><style>body{margin:0;background:#11171c;color:#f1eee7;font:14px Arial,sans-serif}header{padding:18px 24px;background:#26313a;display:flex;gap:22px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0;color:#e4ba6c}select{padding:8px;background:#11171c;color:#f1eee7;border:1px solid #42505a;border-radius:4px}a{color:#e4ba6c}main{padding:20px;display:flex;justify-content:center;width:max-content;min-width:100%;box-sizing:border-box}iframe{display:block;height:852px;width:390px;border:1px solid #42505a;border-radius:4px;background:#11171c;flex-shrink:0}p{margin:0;color:#b5c0c7;font-size:12px}</style></head><body><header><h1>AshenedSpire / responsive editor preview</h1><label>Editor viewport <select id="preset"><option value="390">Phone / 390 px</option><option value="900">Tablet / 900 px</option><option value="1360">Desktop / 1360 px</option><option value="1360x650">Design review / 1360 x 650 px</option></select></label><a href="./index.html">Return to workbench</a><p>Real editor rendered in a fixed viewport. Physical touch is not simulated.</p></header><main><iframe id="editor" title="Responsive AshenedSpire editor" src="./index.html"></iframe></main><script>document.querySelector('#preset').addEventListener('change',e=>{const [width,height='852']=e.target.value.split('x');const frame=document.querySelector('#editor');frame.style.width=width+'px';frame.style.height=height+'px';document.querySelector('main').style.padding=Number(width)>=1360?'0':'20px';frame.style.borderWidth=Number(width)>=1360?'0':'1px';});</script></body></html>
